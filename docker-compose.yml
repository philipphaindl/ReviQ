services:
  slr-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviq-backend
    ports:
      # Bound to loopback deliberately. ReviQ has no authentication, so a
      # port on 0.0.0.0 lets anyone on the same network read every project —
      # and, once grey-literature retrieval is configured, spend the API
      # credits attached to it. Override BIND_HOST only if you know why.
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - db-data:/data
      - ${BIB_BASE_DIR:-./bib_data}:/bib_data:ro
    environment:
      - DATABASE_URL=sqlite:////data/reviq.db
      # Where everything that has to survive a rebuild lives. Without it the
      # retrieval CLI falls back to a relative `data/`, which inside the
      # container is /app/data — outside the mounted volume. The WARC archive
      # holding the retrieved bytes would then be discarded by the next
      # `docker compose up --build`. replication.py already assumed /data.
      - DATA_DIR=/data
      - BIB_BASE_DIR=/bib_data
      # Grey-literature retrieval keys, passed through from the host rather
      # than assigned: `- VAR` without a value forwards it only when it is set,
      # so an absent key stays absent and `_require_key` can say which one is
      # missing. `- VAR=${VAR}` would hand the process an empty string instead
      # and the message would name the wrong problem.
      #
      # Documented in .env.example. They are never stored, logged or accepted
      # over HTTP — see redact.py.
      - SEARCHAPI_API_KEY
      - SCRAPINGBEE_API_KEY
      - ANTHROPIC_API_KEY
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  slr-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviq-frontend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - slr-backend
    restart: unless-stopped

volumes:
  db-data:
    name: reviq-db-data
