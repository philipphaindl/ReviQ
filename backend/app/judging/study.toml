# Study configuration for the LLM-assisted derivation of a quality model
# (docs/aiqm-study/PLAN.md). Every value a run depends on lives here, so the
# file is the artefact a methods section cites and the replication package
# carries. Thresholds were fixed a priori on 2026-10-23 (PLAN.md, E6); changing
# one after G0 is a protocol deviation and has to be reported as such.

[study]
name = "aiqm"
# "studie": prompts frozen at G2, human gold standard, every figure of B.6.
# "review": fully automated; humans optional through active learning.
mode = "studie"
seed = 20261023
# ReviQ projects created by `python -m app.judging init-study`.
main_project = "AIQM - main"
calibration_project = "AIQM - calibration"
validation_project = "AIQM - validation"

[jury]
anchor_sample = 100          # records every judge votes on (E1)
tau_exclude = 0.02           # exclude only if P(relevant) <= this
tau_include = 0.5            # pass on if P(relevant) >= this
max_rounds = 4
alpha_min = 0.667            # lower bootstrap bound of Krippendorff's alpha
recall_min = 0.95            # model-based recall estimate
bootstrap_resamples = 2000

[audit]
# Sample size follows from the target error rate (rule of three: n = 3 / eps).
eps_studie = 0.01
eps_review = 0.02

[abstraction]
ari_median_min = 0.7
ari_lower_min = 0.5           # 2.5 % quantile of the bootstrap distribution

# One judge per model family. `ladder` lists the candidates from mid-tier
# upwards; calibration keeps the first rung whose estimated sensitivity is at
# most `ladder_tolerance` below the top rung (E2). A model id of "TBD" is not
# pinned yet; `freeze` refuses to run until every rung in use is pinned.
# Prices are USD per million tokens and only feed the cost estimate.
[ladder]
tolerance = 0.02

[[judge]]
key = "J1"
family = "anthropic"
role = "R3"
ladder = [
  { model = "claude-sonnet-5-5", price_in = 2.0, price_out = 10.0, batch_discount = 0.5 },
  { model = "claude-opus-5-5", price_in = 4.0, price_out = 20.0, batch_discount = 0.5 },
]

[[judge]]
key = "J2"
family = "openai"
role = "R4"
ladder = [
  { model = "TBD", price_in = 2.0, price_out = 10.0, batch_discount = 0.5 },
]

[[judge]]
key = "J3"
family = "google"
role = "R5"
ladder = [
  { model = "TBD", price_in = 1.5, price_out = 9.0, batch_discount = 0.5 },
]

[[judge]]
key = "J4"
family = "open-weight"
role = "R6"
local = true
# Ollama is pinned by digest, not by tag: a tag can be re-pointed.
ladder = [
  { model = "TBD", digest = "TBD", price_in = 0.0, price_out = 0.0, batch_discount = 1.0 },
]
