# Starting points of the quasi-gold standard (protocol.md, section 5.3), taken
# from PROMPT.md parts B.4, D and F. `role` says why a work is here:
#   seed      an academic seed model (B.4)
#   review    a known review of AI maturity or readiness models (D.1, cluster 1)
#   related   other topical work from the reference list (D.1, clusters 2 and 6)
# `expand = true` adds the work's own references from OpenAlex as candidates
# ("the sources of the seed models and of the known reviews").
# Works without a DOI are resolved by title. Every candidate is checked by both
# authors before the split ("QGS-Liste gegenlesen").

